[package]
name = "cle-trader"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "=1.38.0", features = ["full"] }
tokio-tungstenite = { version = "=0.19.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
arc-swap = "=1.7.1"
thiserror = "=1.0.58"
uuid = { version = "=1.7.0", features = ["v4"] }
futures = "=0.3.30"
tracing = "=0.1.40"
tracing-subscriber = "=0.3.18"
once_cell = "=1.19.0"
anyhow = "=1.0.80"
hmac = "=0.12.1"
sha2 = "=0.10.8"
hex = "=0.4.3"
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls"] }
